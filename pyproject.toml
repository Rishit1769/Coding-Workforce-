[project]
name = "coding-workforce"
version = "0.1.0"
description = "Local, documentation-driven, multi-agent software engineering workforce orchestrating Claude Code, Codex CLI and OpenCode."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pypdf>=4.2",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "reportlab>=4.2",
]

[project.scripts]
workforce = "workforce.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workforce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: tests that call real provider CLIs and consume subscription usage (opt-in via WORKFORCE_LIVE=1)",
]
addopts = "-q"
