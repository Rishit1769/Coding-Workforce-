mode: supervised
require_architecture_approval: true
require_integration_approval: true
roles:
  manager:
    provider: opencode
    model: opencode-go/deepseek-v4.1-flash
    desired_model: DeepSeek V4.1 Flash
    plan: OpenCode Go
    reasoning_effort: null
    timeout_s: null
    enabled: true
    override_reason: null
  architect:
    provider: claude_code
    model: claude-opus-5-5
    desired_model: Claude Opus 5.5
    plan: Claude Pro
    reasoning_effort: null
    timeout_s: null
    enabled: true
    override_reason: null
  developer_1:
    provider: codex
    model: gpt-6.1-sol
    desired_model: GPT-6.1 Sol Medium
    plan: ChatGPT Plus / Codex
    reasoning_effort: medium
    timeout_s: null
    enabled: true
    override_reason: null
  developer_2:
    provider: claude_code
    model: claude-sonnet-5-5
    desired_model: Claude Sonnet 5.5
    plan: Claude Pro
    reasoning_effort: null
    timeout_s: null
    enabled: true
    override_reason: null
  tester:
    provider: opencode
    model: opencode-go/deepseek-v4.1-flash
    desired_model: DeepSeek V4.1 Flash
    plan: OpenCode Go
    reasoning_effort: null
    timeout_s: null
    enabled: true
    override_reason: null
  reviewer:
    provider: codex
    model: gpt-5.6-sol
    desired_model: GPT-5.6 Sol
    plan: ChatGPT Plus / Codex
    reasoning_effort: high
    timeout_s: null
    enabled: true
    override_reason: null
  devops:
    provider: codex
    model: gpt-6-sol
    desired_model: GPT-6 Sol
    plan: ChatGPT Plus / Codex
    reasoning_effort: medium
    timeout_s: null
    enabled: true
    override_reason: null
  worker:
    provider: opencode
    model: opencode-go/deepseek-v4.1-flash
    desired_model: DeepSeek V4.1 Flash
    plan: OpenCode Go
    reasoning_effort: null
    timeout_s: null
    enabled: true
    override_reason: null
providers:
  claude_code:
    binary: claude
    max_concurrency: 2
    default_timeout_s: 1800
    max_retries: 1
    max_calls_per_hour: 40
    circuit_breaker:
      failure_threshold: 3
      cooldown_s: 300
      usage_limit_cooldown_s: 3600
  codex:
    binary: codex
    max_concurrency: 2
    default_timeout_s: 1800
    max_retries: 1
    max_calls_per_hour: 40
    circuit_breaker:
      failure_threshold: 3
      cooldown_s: 300
      usage_limit_cooldown_s: 3600
  opencode:
    binary: opencode
    max_concurrency: 1
    default_timeout_s: 1800
    max_retries: 1
    max_calls_per_hour: 80
    circuit_breaker:
      failure_threshold: 3
      cooldown_s: 300
      usage_limit_cooldown_s: 3600
  scripted:
    binary: ''
    max_concurrency: 4
    default_timeout_s: 1800
    max_retries: 1
    max_calls_per_hour: 100000
    circuit_breaker:
      failure_threshold: 3
      cooldown_s: 300
      usage_limit_cooldown_s: 3600
limits:
  max_dev_concurrency: 2
  max_correction_attempts: 3
  task_wall_clock_s: 14400
  command_timeout_s: 900
  poll_interval_s: 2.0
  provider_wait_s: 60.0
  shutdown_grace_s: 60.0
policy:
  allowed_commands:
  - python -m pytest
  - pytest
  - python -m compileall
  - uv run pytest
  - npm test
  - npm run test
  - npm run build
  - npm run lint
  - npx playwright test
  - make test
  - go test
  - cargo test
  - alembic upgrade
  - alembic downgrade
  protected_branches:
  - main
  - master
  - production
  - release
  protected_paths:
  - .workforce/**
  - requirements/**
  - acceptance_tests/**
  - .git/**
  - .github/workflows/**
  secret_file_globs:
  - .env
  - .env.*
  - '*.pem'
  - '*.key'
  - id_rsa*
  - auth.json
  - credentials*
git:
  integration_branch: wf/integration
  target_branch: main
  branch_prefix: wf/task
  push_authorized: false
  remote: origin
dashboard:
  host: 127.0.0.1
  port: 8765
home: .workforce
